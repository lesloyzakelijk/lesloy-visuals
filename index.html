<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesloy Visuals — Binnenkort online</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f5f4ef"><style>
:root{--bg:#f5f4ef;--ink:#111;--muted:#70706b;--line:rgba(17,17,17,.14)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}body{display:flex;align-items:center;justify-content:center;padding:24px}main{width:min(920px,100%);text-align:center}.brand{font-size:12px;letter-spacing:.28em;font-weight:700;margin-bottom:70px}.kicker{font-size:11px;letter-spacing:.24em;color:var(--muted);margin-bottom:18px}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(48px,9vw,94px);line-height:.92;letter-spacing:-.045em;margin:0}h1 em{font-weight:400}.sub{max-width:520px;margin:26px auto 0;color:#555;line-height:1.65;font-size:16px}.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:650px;margin:54px auto 38px}.unit{padding:20px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.num{font-family:Georgia,serif;font-size:clamp(36px,7vw,62px);line-height:1}.label{font-size:9px;letter-spacing:.2em;color:var(--muted);margin-top:9px}.preview{display:flex;justify-content:center}.code-btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:15px 22px;border-radius:999px;letter-spacing:.14em;font-size:10px;cursor:pointer}.code-box{display:none;margin:18px auto 0;max-width:360px}.code-box.open{display:flex;gap:8px}.code-box input{min-width:0;flex:1;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}.code-box button{padding:0 18px;border:0;border-radius:10px;background:#111;color:#fff}.msg{min-height:22px;margin-top:10px;font-size:12px;color:#777}@media(max-width:560px){body{padding:18px}.brand{margin-bottom:48px}.timer{gap:6px;margin-top:42px}.unit{padding:16px 5px}.label{font-size:8px;letter-spacing:.13em}.sub{font-size:15px}} 
</style></head><body data-assistant="off"><main><div class="brand">LESLOY VISUALS</div><div class="kicker">NIEUWE WEBSITE · BINNENKORT ONLINE</div><h1>WE ZIJN<br><em>BIJNA KLAAR.</em></h1><p class="sub">De nieuwe Lesloy Visuals website gaat op <strong>5 oktober 2026</strong> live. Tot die tijd wordt er nog aan de laatste details gewerkt.</p><section class="timer"><div class="unit"><div class="num" id="days">--</div><div class="label">DAGEN</div></div><div class="unit"><div class="num" id="hours">--</div><div class="label">UREN</div></div><div class="unit"><div class="num" id="minutes">--</div><div class="label">MINUTEN</div></div><div class="unit"><div class="num" id="seconds">--</div><div class="label">SECONDEN</div></div></section><div class="preview"><button class="code-btn" id="openCode" type="button">SITE BEKIJKEN MET CODE</button></div><form class="code-box" id="codeBox"><input id="code" type="password" inputmode="text" autocomplete="off" placeholder="Toegangscode" aria-label="Toegangscode"><button type="submit">OPEN</button></form><div class="msg" id="msg" aria-live="polite"></div></main><script>
const launch=Date.parse("2026-10-05T00:00:00+02:00"),pad=n=>String(n).padStart(2,"0");function tick(){const d=Math.max(0,launch-Date.now()),t=Math.floor(d/1000);document.getElementById("days").textContent=Math.floor(t/86400);document.getElementById("hours").textContent=pad(Math.floor(t%86400/3600));document.getElementById("minutes").textContent=pad(Math.floor(t%3600/60));document.getElementById("seconds").textContent=pad(t%60);if(d<=0)location.href="/site.html"}tick();setInterval(tick,1000);document.getElementById("openCode").onclick=()=>{const b=document.getElementById("codeBox");b.classList.toggle("open");if(b.classList.contains("open"))document.getElementById("code").focus()};document.getElementById("codeBox").onsubmit=e=>{e.preventDefault();if(document.getElementById("code").value.trim()==="LESLOY2026"){sessionStorage.setItem("lesloy_preview","1");location.href="/site.html"}else document.getElementById("msg").textContent="Deze code klopt niet."};
</script></body></html>
